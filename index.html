<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Quantum Frequency Records — Unleash Music's Raw Vibrational Energy."
    >

    <meta
        name="theme-color"
        content="#04060a"
    >

    <title>Quantum Frequency Records</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================================================
         LANDING PAGE
    ========================================================== -->

    <main
        id="landing"
        class="landing"
        aria-label="Quantum Frequency Records introduction"
    >

        <!-- Atmospheric background -->
        <div class="ambient-background"></div>

        <!-- Optional background image -->
        <div class="background-image"></div>

        <!-- Large logo watermark -->
        <div
            class="logo-watermark"
            aria-hidden="true"
        >
            <img
                src="assets/images/logo/qfr-logo.png"
                alt=""
            >
        </div>

        <!-- Particle canvas -->
        <canvas
            id="particleCanvas"
            aria-hidden="true"
        ></canvas>

        <canvas
            id="frequencyCanvas"
            aria-hidden="true"
        ></canvas>

        <div class="wave-field" aria-hidden="true">
            <div class="wave-layer wave-a">
                <svg viewBox="0 0 2400 160" preserveAspectRatio="none">
                    <path d="M0 90 C 120 40 200 140 320 90 C 440 40 520 140 640 90 C 760 40 840 140 960 90 C 1080 40 1160 140 1280 90 C 1400 40 1480 140 1600 90 C 1720 40 1800 140 1920 90 C 2040 40 2120 140 2240 90 C 2320 50 2360 90 2400 90 V 160 H 0 Z" fill="rgba(46,230,214,0.06)"/>
                    <path d="M0 80 C 140 20 220 150 360 80 C 500 10 580 150 720 80 C 860 10 940 150 1080 80 C 1220 10 1300 150 1440 80 C 1580 10 1660 150 1800 80 C 1940 10 2020 150 2160 80 C 2280 30 2340 90 2400 80" fill="none" stroke="rgba(46,230,214,0.45)" stroke-width="1.4"/>
                </svg>
            </div>
            <div class="wave-layer wave-b">
                <svg viewBox="0 0 2400 120" preserveAspectRatio="none">
                    <path d="M0 70 C 100 20 180 110 280 70 C 380 30 460 110 560 70 C 660 30 740 110 840 70 C 940 30 1020 110 1120 70 C 1220 30 1300 110 1400 70 C 1500 30 1580 110 1680 70 C 1780 30 1860 110 1960 70 C 2060 30 2140 110 2240 70 C 2320 40 2360 70 2400 70" fill="none" stroke="rgba(46,230,214,0.35)" stroke-width="1.2"/>
                </svg>
            </div>
            <div class="wave-layer wave-c">
                <svg viewBox="0 0 2400 80" preserveAspectRatio="none">
                    <path d="M0 40 C 80 10 160 70 240 40 C 320 10 400 70 480 40 C 560 10 640 70 720 40 C 800 10 880 70 960 40 C 1040 10 1120 70 1200 40 C 1280 10 1360 70 1440 40 C 1520 10 1600 70 1680 40 C 1760 10 1840 70 1920 40 C 2000 10 2080 70 2160 40 C 2240 10 2320 70 2400 40" fill="none" stroke="rgba(46,230,214,0.55)" stroke-width="1"/>
                </svg>
            </div>
        </div>

        <button
            id="fxToggle"
            class="fx-toggle"
            type="button"
            aria-pressed="true"
            aria-label="Turn atmosphere off"
        >
            FX ON
        </button>

        <!-- Dark cinematic overlay -->
        <div
            class="cinematic-overlay"
            aria-hidden="true"
        ></div>

        <!-- Main content -->
        <section class="landing-content">

            <div class="headline-block">

                <p class="eyebrow">
                    QUANTUM FREQUENCY RECORDS
                </p>

                <h1>
                    Unleash Music’s<br>
                    Raw Vibrational Energy
                </h1>

                <button
                    id="exploreButton"
                    class="explore-button"
                    type="button"
                >

                    <span class="button-text">
                        Explore
                    </span>

                    <span
                        class="button-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </button>

            </div>

            <div
                class="subtitle"
                aria-label="Discover, Harness, Partner, Succeed"
            >

                <span class="subtitle-word active">
                    Discover
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Harness
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Partner
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Succeed
                </span>

            </div>

            <div class="bottom-brand">

                <img
                    src="assets/images/logo/qfr-logo.png"
                    alt="Quantum Frequency Records"
                >

                <p class="brand-name">QUANTUM FREQUENCY</p>
                <p class="brand-sub">RECORDS</p>

            </div>

        </section>


        </section>


        <!-- Scroll indicator -->
        <div
            class="scroll-indicator"
            aria-hidden="true"
        >

            <span class="scroll-line"></span>

            <span class="scroll-text">
                EXPLORE
            </span>

        </div>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="js/landing.js"></script>

</body>
</html>
