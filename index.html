<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Quantum Frequency Records — Unleash Music's Raw Vibrational Energy."
    >

    <meta
        name="theme-color"
        content="#04060a"
    >

    <title>Quantum Frequency Records</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================================================
         LANDING PAGE
    ========================================================== -->

    <main
        id="landing"
        class="landing"
        aria-label="Quantum Frequency Records introduction"
    >

        <!-- Atmospheric background -->
        <div class="ambient-background"></div>

        <!-- Optional background image -->
        <div class="background-image"></div>

        <!-- Large logo watermark -->
        <div
            class="logo-watermark"
            aria-hidden="true"
        >
            <img
                src="assets/images/logo/qfr-logo.png"
                alt=""
            >
        </div>

        <!-- Particle canvas -->
        <canvas
            id="particleCanvas"
            aria-hidden="true"
        ></canvas>

        <div class="wave-field" aria-hidden="true">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 V120 H0 Z" fill="rgba(46,230,214,0.06)"/>
                <path d="M0 70 Q150 40 300 70 T600 70 T900 70 T1200 70" fill="none" stroke="rgba(46,230,214,0.35)" stroke-width="1.2"/>
                <path d="M0 82 Q200 50 400 82 T800 82 T1200 82" fill="none" stroke="rgba(46,230,214,0.2)" stroke-width="1"/>
            </svg>
        </div>

        <!-- Dark cinematic overlay -->
        <div
            class="cinematic-overlay"
            aria-hidden="true"
        ></div>

        <!-- Main content -->
        <section class="landing-content">

            <!-- Main headline -->
            <div class="headline-wrapper">

                <p class="eyebrow">
                    QUANTUM FREQUENCY RECORDS
                </p>

                <h1>
                    Unleash Music’s<br>
                    Raw Vibrational Energy
                </h1>

            </div>


            <!-- Explore button -->
            <button
                id="exploreButton"
                class="explore-button"
                type="button"
            >

                <span class="button-text">
                    Explore
                </span>

                <span
                    class="button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>


            <!-- Animated subtitle -->
            <div
                class="subtitle"
                aria-label="Discover, Harness, Partner, Succeed"
            >

                <span class="subtitle-word active">
                    Discover
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Harness
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Partner
                </span>

                <span class="subtitle-separator">
                    •
                </span>

                <span class="subtitle-word">
                    Succeed
                </span>

            </div>

        </section>


        <!-- Bottom logo -->
        <div class="bottom-brand">

            <img
                src="assets/images/logo/qfr-logo.png"
                alt="Quantum Frequency Records"
            >

            <p class="brand-name"></p>
            <p class="brand-sub"></p>

        </div>


        <!-- Scroll indicator -->
        <div
            class="scroll-indicator"
            aria-hidden="true"
        >

            <span class="scroll-line"></span>

            <span class="scroll-text">
                EXPLORE
            </span>

        </div>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="js/landing.js"></script>

</body>
</html>
